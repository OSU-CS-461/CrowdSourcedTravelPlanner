defaults:
  run:
    working-directory: ./server
on:
  pull_request:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/**"
      - "package.json"
      - "package-lock.json"
      - "server/package.json"
      - "server/package-lock.json"
      - "server/tsconfig*.json"
      - "server/eslint.config.js"
      - "docker-compose.yml"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CI: "true"
  TZ: "UTC"
jobs:
  server-lint:
    name: Server Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARTIFACT_ROOT: ${{ github.workspace }}/artifacts/server-lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "23.10.0"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        id: lint
        run: |
          mkdir -p "$ARTIFACT_ROOT/logs"
          set -o pipefail
          npm run lint 2>&1 | tee "$ARTIFACT_ROOT/logs/server-lint.log"

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Server Lint Job"
            echo ""
            echo "- Lint step outcome: \`${{ steps.lint.outcome }}\`"
            echo "- Lint log: \`artifacts/server-lint/logs/server-lint.log\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload server lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-lint-diagnostics
          path: ${{ env.ARTIFACT_ROOT }}
          if-no-files-found: warn

  server-integration-tests:
    name: Server Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ARTIFACT_ROOT: ${{ github.workspace }}/artifacts/server-integration
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/app_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "23.10.0"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prepare artifact directories
        run: |
          mkdir -p "$ARTIFACT_ROOT/inventory"
          mkdir -p "$ARTIFACT_ROOT/logs"
          mkdir -p "$ARTIFACT_ROOT/reports"

      - name: Generate integration test inventory (non-blocking)
        id: inventory
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:integration:inventory 2>&1 | tee "$ARTIFACT_ROOT/inventory/server-integration-test-inventory.txt"

      - name: Generate prisma client
        id: prisma_generate
        run: |
          set -o pipefail
          npx prisma generate 2>&1 | tee "$ARTIFACT_ROOT/logs/server-integration-prisma-generate.log"

      - name: Run integration tests
        id: integration_tests
        run: |
          set -o pipefail
          npm run test:integration 2>&1 | tee "$ARTIFACT_ROOT/logs/server-integration-tests.log"

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Server Integration Tests Job"
            echo ""
            echo "- Integration test step outcome: \`${{ steps.integration_tests.outcome }}\`"
            echo "- Prisma generate outcome: \`${{ steps.prisma_generate.outcome }}\`"
            echo "- Test inventory outcome: \`${{ steps.inventory.outcome }}\`"
            echo "- Inventory file: \`artifacts/server-integration/inventory/server-integration-test-inventory.txt\`"
            echo "- Prisma log: \`artifacts/server-integration/logs/server-integration-prisma-generate.log\`"
            echo "- Test log: \`artifacts/server-integration/logs/server-integration-tests.log\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload server integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-integration-diagnostics
          path: ${{ env.ARTIFACT_ROOT }}
          if-no-files-found: warn

  server-unit-tests:
    name: Server Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ARTIFACT_ROOT: ${{ github.workspace }}/artifacts/server-unit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "23.10.0"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prepare artifact directories
        run: |
          mkdir -p "$ARTIFACT_ROOT/inventory"
          mkdir -p "$ARTIFACT_ROOT/logs"
          mkdir -p "$ARTIFACT_ROOT/reports"

      - name: Generate unit test inventory (non-blocking)
        id: inventory
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:unit:inventory 2>&1 | tee "$ARTIFACT_ROOT/inventory/server-unit-test-inventory.txt"

      - name: Run unit tests
        id: unit_tests
        run: |
          set -o pipefail
          npm run test:unit 2>&1 | tee "$ARTIFACT_ROOT/logs/server-unit-tests.log"

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Server Unit Tests Job"
            echo ""
            echo "- Unit test step outcome: \`${{ steps.unit_tests.outcome }}\`"
            echo "- Test inventory outcome: \`${{ steps.inventory.outcome }}\`"
            echo "- Inventory file: \`artifacts/server-unit/inventory/server-unit-test-inventory.txt\`"
            echo "- Test log: \`artifacts/server-unit/logs/server-unit-tests.log\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload server unit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-unit-diagnostics
          path: ${{ env.ARTIFACT_ROOT }}
          if-no-files-found: warn

  server-unit-coverage:
    name: Server Unit Coverage (Non-Blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ARTIFACT_ROOT: ${{ github.workspace }}/artifacts/server-unit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "23.10.0"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prepare artifact directories
        run: |
          mkdir -p "$ARTIFACT_ROOT/inventory"
          mkdir -p "$ARTIFACT_ROOT/logs"
          mkdir -p "$ARTIFACT_ROOT/reports/coverage"

      - name: Generate unit test inventory (non-blocking)
        id: inventory
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:unit:inventory 2>&1 | tee "$ARTIFACT_ROOT/inventory/server-unit-coverage-test-inventory.txt"

      - name: Run unit coverage (non-blocking)
        id: coverage
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:unit:coverage 2>&1 | tee "$ARTIFACT_ROOT/logs/server-unit-coverage.log"

      - name: Collect coverage artifacts
        if: always()
        run: |
          if [ -d coverage ]; then
            cp -R coverage/. "$ARTIFACT_ROOT/reports/coverage/"
          fi

      - name: Write coverage summary
        if: always()
        run: |
          {
            echo "## Server Unit Coverage Job"
            echo ""
            echo "- Coverage step outcome: \`${{ steps.coverage.outcome }}\`"
            echo "- Test inventory outcome: \`${{ steps.inventory.outcome }}\`"
            echo "- Inventory file: \`artifacts/server-unit/inventory/server-unit-coverage-test-inventory.txt\`"
            echo "- Coverage log: \`artifacts/server-unit/logs/server-unit-coverage.log\`"
            if [ -f "$ARTIFACT_ROOT/reports/coverage/coverage-summary.json" ]; then
              node -e "const s=require('$ARTIFACT_ROOT/reports/coverage/coverage-summary.json').total; console.log('- Coverage total (lines): ' + s.lines.pct + '%'); console.log('- Coverage total (branches): ' + s.branches.pct + '%'); console.log('- Coverage total (functions): ' + s.functions.pct + '%'); console.log('- Coverage total (statements): ' + s.statements.pct + '%');"
            else
              echo "- Coverage summary json: not found"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload server unit coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-unit-coverage-artifacts
          path: ${{ env.ARTIFACT_ROOT }}
          if-no-files-found: warn

  server-integration-coverage:
    name: Server Integration Coverage (Non-Blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ARTIFACT_ROOT: ${{ github.workspace }}/artifacts/server-integration
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/app_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "23.10.0"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prepare artifact directories
        run: |
          mkdir -p "$ARTIFACT_ROOT/inventory"
          mkdir -p "$ARTIFACT_ROOT/logs"
          mkdir -p "$ARTIFACT_ROOT/reports/coverage"

      - name: Generate integration test inventory (non-blocking)
        id: inventory
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:integration:inventory 2>&1 | tee "$ARTIFACT_ROOT/inventory/server-integration-coverage-test-inventory.txt"

      - name: Generate prisma client
        id: prisma_generate
        run: |
          set -o pipefail
          npx prisma generate 2>&1 | tee "$ARTIFACT_ROOT/logs/server-integration-coverage-prisma-generate.log"

      - name: Run integration coverage (non-blocking)
        id: coverage
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:integration:coverage 2>&1 | tee "$ARTIFACT_ROOT/logs/server-integration-coverage.log"

      - name: Collect coverage artifacts
        if: always()
        run: |
          if [ -d coverage ]; then
            cp -R coverage/. "$ARTIFACT_ROOT/reports/coverage/"
          fi

      - name: Write coverage summary
        if: always()
        run: |
          {
            echo "## Server Integration Coverage Job"
            echo ""
            echo "- Coverage step outcome: \`${{ steps.coverage.outcome }}\`"
            echo "- Prisma generate outcome: \`${{ steps.prisma_generate.outcome }}\`"
            echo "- Test inventory outcome: \`${{ steps.inventory.outcome }}\`"
            echo "- Inventory file: \`artifacts/server-integration/inventory/server-integration-coverage-test-inventory.txt\`"
            echo "- Coverage log: \`artifacts/server-integration/logs/server-integration-coverage.log\`"
            if [ -f "$ARTIFACT_ROOT/reports/coverage/coverage-summary.json" ]; then
              node -e "const s=require('$ARTIFACT_ROOT/reports/coverage/coverage-summary.json').total; console.log('- Coverage total (lines): ' + s.lines.pct + '%'); console.log('- Coverage total (branches): ' + s.branches.pct + '%'); console.log('- Coverage total (functions): ' + s.functions.pct + '%'); console.log('- Coverage total (statements): ' + s.statements.pct + '%');"
            else
              echo "- Coverage summary json: not found"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload server integration coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-integration-coverage-artifacts
          path: ${{ env.ARTIFACT_ROOT }}
          if-no-files-found: warn
