defaults:
  run:
    working-directory: ./client
on:
  pull_request:
    branches:
      - main
    paths:
      - "client/**"
      - ".github/workflows/**"
      - "package.json"
      - "package-lock.json"
      - "client/package.json"
      - "client/package-lock.json"
      - "client/.nvmrc"
      - "client/tsconfig*.json"
      - "client/eslint.config.js"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CI: "true"
  TZ: "UTC"
jobs:
  client-build:
    name: Client Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARTIFACT_ROOT: ${{ github.workspace }}/artifacts/client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "23.10.0"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prepare artifact directories
        run: |
          mkdir -p "$ARTIFACT_ROOT/inventory"
          mkdir -p "$ARTIFACT_ROOT/logs"
          mkdir -p "$ARTIFACT_ROOT/reports"

      - name: Generate test inventory (non-blocking)
        id: inventory
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:inventory 2>&1 | tee "$ARTIFACT_ROOT/inventory/client-build-test-inventory.txt"

      - name: Run build
        id: build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$ARTIFACT_ROOT/logs/client-build.log"

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Client Build Job"
            echo ""
            echo "- Build step outcome: \`${{ steps.build.outcome }}\`"
            echo "- Test inventory outcome: \`${{ steps.inventory.outcome }}\`"
            echo "- Inventory file: \`artifacts/client/inventory/client-build-test-inventory.txt\`"
            echo "- Build log: \`artifacts/client/logs/client-build.log\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload client build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-build-diagnostics
          path: ${{ env.ARTIFACT_ROOT }}
          if-no-files-found: warn

  client-lint:
    name: Client Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARTIFACT_ROOT: ${{ github.workspace }}/artifacts/client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "23.10.0"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prepare artifact directories
        run: |
          mkdir -p "$ARTIFACT_ROOT/inventory"
          mkdir -p "$ARTIFACT_ROOT/logs"
          mkdir -p "$ARTIFACT_ROOT/reports"

      - name: Generate test inventory (non-blocking)
        id: inventory
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:inventory 2>&1 | tee "$ARTIFACT_ROOT/inventory/client-lint-test-inventory.txt"

      - name: Run lint
        id: lint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee "$ARTIFACT_ROOT/logs/client-lint.log"

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Client Lint Job"
            echo ""
            echo "- Lint step outcome: \`${{ steps.lint.outcome }}\`"
            echo "- Test inventory outcome: \`${{ steps.inventory.outcome }}\`"
            echo "- Inventory file: \`artifacts/client/inventory/client-lint-test-inventory.txt\`"
            echo "- Lint log: \`artifacts/client/logs/client-lint.log\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload client lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-lint-diagnostics
          path: ${{ env.ARTIFACT_ROOT }}
          if-no-files-found: warn

  client-tests:
    name: Client Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARTIFACT_ROOT: ${{ github.workspace }}/artifacts/client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "23.10.0"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prepare artifact directories
        run: |
          mkdir -p "$ARTIFACT_ROOT/inventory"
          mkdir -p "$ARTIFACT_ROOT/logs"
          mkdir -p "$ARTIFACT_ROOT/reports"

      - name: Generate test inventory (non-blocking)
        id: inventory
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:inventory 2>&1 | tee "$ARTIFACT_ROOT/inventory/client-tests-test-inventory.txt"

      - name: Run unit tests
        id: tests
        run: |
          set -o pipefail
          npm run test:ci 2>&1 | tee "$ARTIFACT_ROOT/logs/client-tests.log"

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Client Unit Tests Job"
            echo ""
            echo "- Test step outcome: \`${{ steps.tests.outcome }}\`"
            echo "- Test inventory outcome: \`${{ steps.inventory.outcome }}\`"
            echo "- Inventory file: \`artifacts/client/inventory/client-tests-test-inventory.txt\`"
            echo "- Test log: \`artifacts/client/logs/client-tests.log\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload client test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-test-diagnostics
          path: ${{ env.ARTIFACT_ROOT }}
          if-no-files-found: warn

  client-coverage:
    name: Client Coverage (Non-Blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ARTIFACT_ROOT: ${{ github.workspace }}/artifacts/client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "23.10.0"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prepare artifact directories
        run: |
          mkdir -p "$ARTIFACT_ROOT/inventory"
          mkdir -p "$ARTIFACT_ROOT/logs"
          mkdir -p "$ARTIFACT_ROOT/reports/coverage"

      - name: Generate test inventory (non-blocking)
        id: inventory
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:inventory 2>&1 | tee "$ARTIFACT_ROOT/inventory/client-coverage-test-inventory.txt"

      - name: Run coverage (non-blocking)
        id: coverage
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:coverage 2>&1 | tee "$ARTIFACT_ROOT/logs/client-coverage.log"

      - name: Collect coverage artifacts
        if: always()
        run: |
          if [ -d coverage ]; then
            cp -R coverage/. "$ARTIFACT_ROOT/reports/coverage/"
          fi

      - name: Write coverage summary
        if: always()
        run: |
          {
            echo "## Client Coverage Job"
            echo ""
            echo "- Coverage step outcome: \`${{ steps.coverage.outcome }}\`"
            echo "- Test inventory outcome: \`${{ steps.inventory.outcome }}\`"
            echo "- Inventory file: \`artifacts/client/inventory/client-coverage-test-inventory.txt\`"
            echo "- Coverage log: \`artifacts/client/logs/client-coverage.log\`"
            if [ -f "$ARTIFACT_ROOT/reports/coverage/coverage-summary.json" ]; then
              node -e "const s=require('$ARTIFACT_ROOT/reports/coverage/coverage-summary.json').total; console.log('- Coverage total (lines): ' + s.lines.pct + '%'); console.log('- Coverage total (branches): ' + s.branches.pct + '%'); console.log('- Coverage total (functions): ' + s.functions.pct + '%'); console.log('- Coverage total (statements): ' + s.statements.pct + '%');"
            else
              echo "- Coverage summary json: not found"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload client coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-coverage-artifacts
          path: ${{ env.ARTIFACT_ROOT }}
          if-no-files-found: warn
