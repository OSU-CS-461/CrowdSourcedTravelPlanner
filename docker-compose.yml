# Optional local PostgreSQL (not required). Default dev DB is Prisma dev — see WINDOWS_SETUP.md.
# docker compose up -d  then set server/.env DATABASE_URL to the postgresql://... string for this container.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cstp_local_dev
      POSTGRES_DB: cstp
    ports:
      # Host 5433 avoids clashing with an existing Postgres on 5432
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cstp"]
      interval: 3s
      timeout: 5s
      retries: 10
